<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f6f8fa; }
        #app { max-width: 900px; margin: 0 auto; }
        .hidden { display: none; }
        #error { padding: 0.75rem; border-radius: 8px; background: #ffebe9; color: #cf222e; }
        #users-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .user-card { padding: 1rem; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
        .user-card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div id="app">
        <h1>User Directory</h1>
        <div id="loading" role="status">Loading...</div>
        <div id="error" class="hidden" role="alert"></div>
        <div id="users-container"></div>
    </div>
    <script src="async-practice.js"></script>
</body>
</html>
